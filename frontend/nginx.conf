# Khoj frontend — static SPA served by nginx, with /api proxied to the backend.
#
# Two things here are not the nginx default and both matter:
#   * SPA fallback: React Router owns the client-side routes, so any unknown
#     path must return index.html rather than a 404.
#   * proxy_buffering off on /api: the live feed (GET /api/jobs/stream) is a
#     Server-Sent Events stream. With buffering on, nginx holds each event until
#     its buffer fills, so a feed whose whole point is arriving immediately would
#     stall. The backend already disables gzip for text/event-stream.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived, content-hashed assets can be cached hard; index.html cannot,
    # or a deploy would keep serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND_URL is substituted at container start (see the Dockerfile CMD).
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events on /api/jobs/stream.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
